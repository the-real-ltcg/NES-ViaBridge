# Increase memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric / Minecraft (must match the NES build: 26.2, official Mojang mappings).
minecraft_version=26.2
loader_version=0.18.4
loom_version=1.15-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=cheeezer.viabridge
archives_base_name=nes-viabridge

# Dependencies
fabric_version=0.152.2+26.2

# ViaVersion stack (full range: VV + ViaBackwards + ViaRewind).
# On snapshots so a refreshed rebuild picks up newer 26.2 down-conversion work.
viaversion_version=5.10.1-SNAPSHOT
viabackwards_version=5.10.1-SNAPSHOT
viarewind_version=4.1.3-SNAPSHOT
